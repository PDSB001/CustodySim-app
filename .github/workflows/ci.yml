name: Android CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - run: bash scripts/check-workflows.sh
      - name: Verify vendored reader hashes
        run: node scripts/verify-episteme.mjs
      - name: Unit tests, lint and release builds
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease androidCorrespondingSource --no-daemon --console=plain
      - name: Verify corresponding-source archive
        run: |
          node scripts/verify-source-archive.mjs
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p build/ci-artifacts
          cp app/build/outputs/apk/debug/*.apk build/ci-artifacts/
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/ci-artifacts/
          cp build/distributions/CustodySim-Android-corresponding-source.zip build/ci-artifacts/
          printf '%s\n' "$GITHUB_SHA" > build/ci-artifacts/COMMIT.txt
          (cd build/ci-artifacts && sha256sum ./*.apk ./*.zip COMMIT.txt > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-${{ github.sha }}
          path: build/ci-artifacts/
          if-no-files-found: error
          retention-days: 14

name: Set up Android toolchain
description: Configure JDK, Gradle wrapper validation, cache and Android API 37
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Install the required Android SDK
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;37.0.0'
        chmod +x gradlew

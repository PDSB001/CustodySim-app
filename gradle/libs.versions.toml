[versions]
# AGP 9.4 要求 Gradle >= 9.6.0（官方兼容表）；AGP 9 起内置 Kotlin，无需 kotlin-android 插件。
agp = "9.4.1"
# Kotlin 编译器与 Compose / Serialization 插件保持同版，覆盖 AGP 内置的旧 KGP。
kotlin = "2.4.21"
composeBom = "2026.09.00"

coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
work = "2.12.0"
datastore = "1.3.0"
okhttp = "5.5.1"
junit = "4.13.2"
backdrop = "2.0.1"
androidSvg = "1.4"
androidTestRunner = "1.7.0"
profileInstaller = "1.4.1"
exifInterface = "1.4.2"
# Reviewed Episteme dependency set; versions are pinned for reproducible imports.
readerJsoup = "1.23.2"
readerTimber = "5.0.1"
readerCoroutines = "1.11.0"
readerSerialization = "1.12.0"
# MiuiX（小米 HyperOS 风格 Compose 组件库）。纯 Android 项目必须用带 -android 后缀的构件。
miuix = "0.9.4"
# MiuiX 的弹层内部用 NavigationBackHandler，需提供 navigationevent 的 dispatcher owner。
navigationEvent = "1.2.0"

[libraries]
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "35.1.0" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
umeng-fcm = { module = "com.umeng.umsdk:fcm-umengaccs", version = "2.3.0" }
umeng-common = { module = "com.umeng.umsdk:common", version = "10.0.1" }
umeng-asms = { module = "com.umeng.umsdk:asms", version = "1.8.7.2" }
umeng-push = { module = "com.umeng.umsdk:push", version = "6.7.6" }
umeng-huawei = { module = "com.umeng.umsdk:huawei-umengaccs", version = "2.3.0" }
huawei-push = { module = "com.huawei.hms:push", version = "6.13.0.301" }
test-json = { module = "org.json:json", version = "20260814" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
reader-jsoup = { module = "org.jsoup:jsoup", version.ref = "readerJsoup" }
reader-timber = { module = "com.jakewharton.timber:timber", version.ref = "readerTimber" }
reader-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "readerCoroutines" }
reader-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "readerSerialization" }
reader-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "readerSerialization" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
miuix-ui-android = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference-android = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons-android = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEvent" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
backdrop-android = { module = "io.github.kyant0:backdrop-android", version.ref = "backdrop" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidSvg" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidTestRunner" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifInterface" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }

[plugins]
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
